version: '3.8'

services:
  backend:
    build: ./backend
    container_name: pensieve-backend
    ports:
      - "8080:8080"
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=sdfof2005
      - MYSQL_DATABASE=pensieve
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6334
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - SERVER_PORT=8080
      - UPLOAD_DIR=/app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - mysql
      - redis
      - qdrant

  mysql:
    image: mysql:8.0
    container_name: pensieve-mysql
    environment:
      MYSQL_ROOT_PASSWORD: sdfof2005
      MYSQL_DATABASE: pensieve
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: pensieve-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: pensieve-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  mysql_data:
  redis_data:
  qdrant_data:
  uploads_data:
